<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przetwórz tekst</title>
</head>
<body>
    <h1>Prześlij plik tekstowy</h1>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="file" accept=".txt" required>
        <br>
        <button type="submit">Przetwórz</button>
    </form>
</body>
</html>
